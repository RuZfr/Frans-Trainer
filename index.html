<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#315EE8">
  <meta name="description" content="Eenvoudige Franse woordentrainer">
  <title>Frans Trainer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="icons/favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=1.15.2">
</head>
<body>
  <div id="splash" class="splash-screen" aria-hidden="true">
    <div class="splash-inner">
      <img class="splash-logo" src="icons/logo-mark.svg" alt="" width="96" height="96">
      <p class="splash-kicker">FRANS TRAINER</p>
      <h2 class="splash-title">snel Frans oefenen</h2>
    </div>
  </div>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="icons/logo-mark.svg" alt="" width="48" height="48">
        <div class="brand-copy">
          <p class="eyebrow">LEREN OP JOUW TEMPO</p>
          <h1>Frans Trainer</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="themeBtn" class="icon-button theme-button" type="button" aria-label="Donkere modus" title="Donkere modus"><img id="themeIcon" class="button-icon" src="icons/icon-moon.svg" alt=""><span class="sr-only">Donkere modus</span></button>
        <button id="settingsBtn" class="icon-button settings-button" type="button"
          aria-label="Instellingen" title="Instellingen"><img class="button-icon" src="icons/icon-settings.svg" alt=""><span class="sr-only">Instellingen</span></button>
      </div>
    </header>

    <section class="controls" aria-label="Oefeninstellingen">
      <div class="control-field control-field-wide">
        <label for="wordListSelect">Woordenlijst</label>
        <select id="wordListSelect" aria-label="Woordenlijst">
          <option value="basis">Basiswoordenschat</option>
        </select>
      </div>

      <div class="control-field">
        <label for="categorySelect">Categorie</label>
        <select id="categorySelect" aria-label="Categorie">
          <option value="all">Alle categorieën</option>
        </select>
      </div>

      <div class="control-field">
        <label for="exerciseMode">Oefening</label>
        <select id="exerciseMode">
          <option value="cards">Flitskaartjes</option>
          <option value="typing">Schriftelijk</option>
        </select>
      </div>

      <div class="control-field">
        <label for="direction">Richting</label>
        <select id="direction">
          <option value="fr-nl">Frans → Nederlands</option>
          <option value="nl-fr">Nederlands → Frans</option>
          <option value="random">Willekeurig</option>
        </select>
      </div>
    </section>

    <section class="session-strip" aria-label="Oefensessie">
      <div class="statusline">
        <span id="status">Laden…</span>
        <span id="progressCount"></span>
      </div>
      <div class="progress-wrap" aria-label="Voortgang">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </section>

    <button id="card" class="card" aria-live="polite" aria-label="Toon antwoord">
      <span id="question" class="question">Laden…</span>
      <span id="answer" class="answer" hidden></span>
      <span id="answerInfo" class="answer-info" hidden></span>
    </button>


    <form id="typingForm" class="typing-panel" hidden>
      <label for="typingInput">Jouw antwoord</label>
      <div class="typing-row">
        <input id="typingInput" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button id="checkBtn" type="submit" class="primary-small">Controleer</button>
      </div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
    </form>

    <div id="ratingActions" class="actions">
      <button id="hardBtn" class="hard" disabled>✗ Moeilijk</button>
      <button id="easyBtn" class="easy" disabled>✓ Weet ik</button>
    </div>

    <button id="hardOnlyBtn" class="secondary">Alleen moeilijke woorden</button>

  </main>
  <div id="settingsBackdrop" class="settings-backdrop" hidden></div>
  <aside id="settingsPanel" class="settings-panel" aria-labelledby="settingsTitle" aria-hidden="true">
    <div class="settings-panel-header">
      <div>
        <p class="settings-kicker">Frans Trainer</p>
        <h2 id="settingsTitle">Instellingen</h2>
      </div>
      <button id="settingsCloseBtn" class="icon-button" type="button" aria-label="Sluit instellingen"><img class="button-icon" src="icons/icon-close.svg" alt=""><span class="sr-only">Sluit instellingen</span></button>
    </div>
    <div class="settings-panel-body">
      <section class="settings-section" aria-labelledby="listSettingsTitle">
        <h3 id="listSettingsTitle">Woordenlijsten</h3>
        <p id="listStats" class="settings-meta">Laden…</p>
        <input id="listFileInput" type="file" accept=".json,.csv,.txt,application/json,text/csv,text/plain" hidden>
        <button id="importListBtn" class="settings-action" type="button">＋ Woordenlijst importeren</button>
        <button id="removeListBtn" class="settings-action danger" type="button" hidden>Verwijder eigen woordenlijst</button>
        <a class="settings-link" href="data/templates/woordenlijst-voorbeeld.csv" download>Voorbeeld CSV downloaden</a>
        <p id="listImportStatus" class="settings-status" aria-live="polite"></p>
        <p class="settings-help">JSON en CSV worden lokaal op dit toestel opgeslagen. Bij zelfstandige naamwoorden controleert de import of een lidwoord ontbreekt.</p>
      </section>
    </div>
  </aside>


  <script src="js/list-import.js?v=1.15.2"></script>
  <script src="js/words.js?v=1.15.2"></script>
  <script src="js/storage.js?v=1.15.2"></script>
  <script src="js/app.js?v=1.15.2"></script>
</body>
</html>
